apiVersion: build.openshift.io/v1
kind: BuildConfig

metadata:
  name: tutorial-service

spec:

  source:
    git:
      uri: https://github.com/amir35/tutorial-system.git
      ref: feature/openshift

    contextDir: tutorial-service        #PAth wehre Dockerfile is available in the repo

    type: Git

  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile

  output:
    to:
      kind: ImageStreamTag
      name: tutorial-service:latest

  triggers:
    - type: ConfigChange