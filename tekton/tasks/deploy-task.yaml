apiVersion: tekton.dev/v1
kind: Task

metadata:
  name: deploy-task

spec:

  steps:

    - name: deploy
      image: quay.io/openshift/origin-cli:latest

      script: |
        #!/bin/sh
        set -e

        echo "======================================"
        echo "Starting Deployment"
        echo "======================================"

        echo ""
        echo "Current project:"
        oc project

        echo ""
        echo "Current image:"
        oc get deployment tutorial-service \
          -o jsonpath='{.spec.template.spec.containers[0].image}'

        echo ""
        echo ""
        echo "Restarting tutorial-service deployment..."

        oc rollout restart deployment/tutorial-service

        echo ""
        echo "Waiting for rollout..."

        oc rollout status deployment/tutorial-service \
          --timeout=300s

        echo ""
        echo "======================================"
        echo "Deployment Successful"
        echo "======================================"

        echo ""
        echo "Deployment:"
        oc get deployment tutorial-service

        echo ""
        echo "Pods:"
        oc get pods -l app=tutorial-service