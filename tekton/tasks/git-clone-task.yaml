apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone-task

spec:
  params:
    - name: repo-url
      type: string

    - name: revision
      type: string
      default: main

  workspaces:
    - name: source

  steps:
    - name: clone
      image: alpine/git:latest

      script: |
        #!/bin/sh
        set -e

        echo "======================================"
        echo "Starting Git Clone"
        echo "======================================"

        echo "Repository:"
        echo "$(params.repo-url)"

        echo "Revision:"
        echo "$(params.revision)"
  
        echo "Workspace:"
        echo "$(workspaces.source.path)"
  
        echo "========================================"
  
        # Convert Git ref to branch name if required
        REVISION="$(params.revision)"

        case "$REVISION" in
          refs/heads/*)
            REVISION="${REVISION#refs/heads/}"
            ;;
        esac
  
        echo "Effective branch:"
        echo "$REVISION"
  
        echo "========================================"
  
        rm -rf "$(workspaces.source.path)"/*
  
        git clone \
          --branch "$REVISION" \
          "$(params.repo-url)" \
          "$(workspaces.source.path)"

        echo "======================================"
        echo "Git Clone completed successfully"
        echo "======================================"

        echo "Repository contents:"
        ls -la "$(workspaces.source.path)"