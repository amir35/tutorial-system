apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-build-task

spec:
  workspaces:
    - name: source

  steps:
    - name: maven-build
      image: maven:3.9.9-eclipse-temurin-21

      workingDir: $(workspaces.source.path)/tutorial-service

      script: |
        #!/bin/sh
        set -e

        echo "======================================"
        echo "Starting Maven Build"
        echo "======================================"

        echo "Java version:"
        java -version

        echo ""
        echo "Maven version:"
        mvn -version

        echo ""
        echo "Working directory:"
        pwd

        echo ""
        echo "Project files:"
        ls -la

        echo ""
        echo "======================================"
        echo "Running Maven clean package"
        echo "======================================"

        mvn clean package

        echo ""
        echo "======================================"
        echo "Maven Build completed successfully"
        echo "======================================"

        echo ""
        echo "Generated files:"
        ls -la target/