apiVersion: tekton.dev/v1
kind: Task

metadata:
  name: image-build-task

spec:

  params:

    - name: APP_NAME
      type: string

  workspaces:
    - name: source

  steps:

    - name: build-image
      image: quay.io/openshift/origin-cli:latest

      workingDir: $(workspaces.source.path)/$(params.APP_NAME)

      script: |
        #!/bin/sh
        set -e

        echo "========================================"
        echo "Starting OpenShift Image Build"
        echo "========================================"

        echo ""
        echo "Application:"
        echo "$(params.APP_NAME)"

        echo ""
        echo "Working directory:"
        pwd

        echo ""
        echo "Source files:"
        ls -la

        echo ""
        echo "Logging into OpenShift..."

        oc login \
          --server=https://kubernetes.default.svc \
          --token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
          --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        echo ""
        echo "Current OpenShift project:"
        oc project

        echo ""
        echo "========================================"
        echo "Starting Binary Build"
        echo "========================================"

        oc start-build $(params.APP_NAME)-tekton \
          --from-dir="$(workspaces.source.path)/$(params.APP_NAME)" \
          --follow

        echo ""
        echo "========================================"
        echo "Image Build Completed"
        echo "========================================"

        echo ""
        echo "ImageStream:"
        oc get imagestream $(params.APP_NAME)

        echo ""
        echo "ImageStream Tags:"
        oc get istag $(params.APP_NAME):latest