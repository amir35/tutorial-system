apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: tutorial-service-tekton

spec:
  runPolicy: Serial

  source:
    type: Binary

  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile

  output:
    to:
      kind: ImageStreamTag
      name: tutorial-service:latest

  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5