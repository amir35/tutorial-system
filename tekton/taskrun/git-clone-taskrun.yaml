apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  name: git-clone-taskrun

spec:
  taskRef:
    name: git-clone-task

  params:
    - name: repo-url
      value: https://github.com/amir35/tutorial-system.git

    - name: revision
      value: feature/tekton

  workspaces:
    - name: source
      emptyDir: {}