<div>
  <div class="submit-form">
    <!-- ✅ If not submitted -->
    <div *ngIf="!submitted; else submittedBlock">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" class="form-control" id="title" required [(ngModel)]="tutorial.title" name="title"/>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <input class="form-control" id="description" required [(ngModel)]="tutorial.description" name="description"/>
      </div>

      <button (click)="saveTutorial()" class="btn btn-success">
        Submit
      </button>
    </div>

    <!-- ✅ Else block -->
    <ng-template #submittedBlock>
      <h4>Tutorial was submitted successfully!</h4>
      <button class="btn btn-success" (click)="newTutorial()">Add</button>
    </ng-template>
  </div>
</div>
